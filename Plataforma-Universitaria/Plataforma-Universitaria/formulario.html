
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario | UniCore</title>

    <!-- Conexión con los estilos CSS del proyecto -->
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header class="encabezado">

        <div class="logo">🎓 UniCore</div>

        <nav class="navegacion">
            <a href="index.html">Inicio</a>
            <a href="carreras.html">Carreras</a>
            <a href="asignaturas.html">Asignaturas</a>
            <a href="estudiantes.html">Estudiantes</a>
            <a href="contacto.html">Contacto</a>
            <a href="formulario.html" class="activo">Formulario</a>
        </nav>

    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenido">

        <section class="bienvenida">
            <h1>Formulario de Registro</h1>

            <h2>Bienvenido a UniCore</h2>

            <p>
                Completa tus datos personales y académicos
                para registrar tu solicitud universitaria.
            </p>
        </section>

        <!-- FORMULARIO -->
        <form class="formulario-unicore"
              action="#"
              method="post">

            <h2>Datos del estudiante</h2>

            <!-- NOMBRE -->
            <div class="grupo-campo">

                <label for="nombre">
                    Nombre completo:
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Escribe tu nombre completo"
                    autocomplete="name"
                    required
                >

            </div>

            <!-- MATRÍCULA -->
            <div class="grupo-campo">

                <label for="matricula">
                    Número de matrícula:
                </label>

                <input
                    type="text"
                    id="matricula"
                    name="matricula"
                    placeholder="Ejemplo: 2026-001"
                    required
                >

            </div>

            <!-- CORREO -->
            <div class="grupo-campo">

                <label for="correo">
                    Correo electrónico:
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="ejemplo@correo.com"
                    autocomplete="email"
                    required
                >

            </div>

            <!-- TELÉFONO -->
            <div class="grupo-campo">

                <label for="telefono">
                    Número de teléfono:
                </label>

                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="Ingresa tu teléfono"
                    autocomplete="tel"
                    required
                >

            </div>

            <!-- CARRERA -->
            <div class="grupo-campo">

                <label for="carrera">
                    Selecciona tu carrera:
                </label>

                <select id="carrera" name="carrera" required>

                    <option value="">
                        Selecciona una carrera
                    </option>

                    <option value="Informatica">
                        Informática
                    </option>

                    <option value="Administracion">
                        Administración
                    </option>

                    <option value="Contabilidad">
                        Contabilidad
                    </option>

                    <option value="Educacion">
                        Educación
                    </option>

                    <option value="Derecho">
                        Derecho
                    </option>

                </select>

            </div>

            <!-- ASIGNATURA -->
            <div class="grupo-campo">

                <label for="asignatura">
                    Asignatura:
                </label>

                <input
                    type="text"
                    id="asignatura"
                    name="asignatura"
                    placeholder="Escribe el nombre de la asignatura"
                    required
                >

            </div>

            <!-- COMENTARIOS -->
            <div class="grupo-campo">

                <label for="comentarios">
                    Comentarios o solicitudes:
                </label>

                <textarea
                    id="comentarios"
                    name="comentarios"
                    rows="5"
                    placeholder="Escribe aquí tus comentarios..."
                ></textarea>

            </div>

            <!-- ACEPTACIÓN -->
            <div class="grupo-campo">

                <label>
                    <input
                        type="checkbox"
                        name="aceptacion"
                        required
                    >
                    Confirmo que los datos proporcionados son correctos.
                </label>

            </div>

            <!-- BOTONES -->
            <div class="botones-formulario">

                <button
                    type="submit"
                    class="btn-enviar">
                    Enviar formulario
                </button>

                <button
                    type="reset"
                    class="btn-limpiar">
                    Limpiar campos
                </button>

            </div>

        </form>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="pie-pagina">

        <p>
            © 2026 UniCore. Todos los derechos reservados.
        </p>

    </footer>

</body>
</html>
